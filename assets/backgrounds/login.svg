      <stop offset="65%" stop-color="#0E1B35" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#07101F" stop-opacity="0"/>
    </radialGradient>

    <filter id="loginBlur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

