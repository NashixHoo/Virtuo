<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="loginBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030814"/>
      <stop offset="50%" stop-color="#07101F"/>
      <stop offset="70%" stop-color="#0E1B35"/>
      <stop offset="100%" stop-color="#020610"/>
