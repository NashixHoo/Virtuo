<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico Haste Esquerda -->
    <linearGradient id="darkMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="25%" stop-color="#D2EBF7"/>
      <stop offset="50%" stop-color="#89C4E1"/>
      <stop offset="75%" stop-color="#4B86AA"/>
      <stop offset="100%" stop-color="#1A4363"/>
    </linearGradient>

    <!-- Gradiente Metálico Haste Direita com Curva Interna -->
    <linearGradient id="darkMetalRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F8FF"/>
      <stop offset="30%" stop-color="#B2E7FA"/>
      <stop offset="60%" stop-color="#55ACD4"/>
      <stop offset="85%" stop-color="#245F85"/>
      <stop offset="100%" stop-color="#0E2D44"/>
    </linearGradient>

    <!-- Gradiente Faceta Central -->
    <linearGradient id="darkMetalFacet" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7EE7FF"/>
      <stop offset="100%" stop-color="#1E5275" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Celestial Suave -->
    <radialGradient id="darkHorizonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7EE7FF" stop-opacity="0.80"/>
      <stop offset="40%" stop-color="#7EE7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07101F" stop-opacity="0"/>
    </radialGradient>

    <filter id="darkGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luz do Horizonte sob o V -->
  <ellipse cx="256" cy="385" rx="170" ry="40" fill="url(#darkHorizonGlow)"/>

  <!-- Símbolo V Metálico -->
  <g filter="url(#darkGlowFilter)">
    <!-- Haste Esquerda Reta -->
    <path d="M 126 120 L 186 120 L 256 370 L 212 370 Z" fill="url(#darkMetalLeft)"/>

    <!-- Haste Direita com Curva Interna Sutil -->
    <path d="M 386 120 L 326 120 C 300 186, 278 252, 256 370 L 300 370 C 328 265, 356 186, 386 120 Z" fill="url(#darkMetalRight)"/>

    <!-- Vértice Chanfrado -->
    <polygon points="212,370 256,370 300,370 256,404" fill="url(#darkMetalFacet)"/>

    <!-- Linhas de Realce Metálico -->
    <path d="M 126 120 L 256 404 L 386 120" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 186 120 L 256 370 C 278 252, 300 186, 326 120" fill="none" stroke="#7EE7FF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Ponto de Brilho no Vértice -->
  <circle cx="256" cy="404" r="4" fill="#FFFFFF"/>
  <circle cx="256" cy="404" r="8" fill="#7EE7FF" opacity="0.7"/>
</svg>
