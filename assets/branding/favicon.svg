<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#89C4E1"/>
      <stop offset="100%" stop-color="#1A4363"/>
    </linearGradient>

    <linearGradient id="favMetalRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F8FF"/>
      <stop offset="40%" stop-color="#7EE7FF"/>
      <stop offset="100%" stop-color="#0E2D44"/>
    </linearGradient>

    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7EE7FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7EE7FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07101F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Dark para Favicon -->
  <rect width="64" height="64" rx="14" fill="#07101F"/>

  <!-- Glow no horizonte sob o V -->
  <ellipse cx="32" cy="48" rx="22" ry="7" fill="url(#favGlow)"/>

  <!-- Símbolo V Oficial -->
  <!-- Haste Esquerda -->
  <path d="M 14 14 L 23 14 L 32 46 L 26 46 Z" fill="url(#favMetalLeft)"/>

  <!-- Haste Direita com Curva Interna Sutil -->
  <path d="M 50 14 L 41 14 C 37 24, 34 34, 32 46 L 38 46 C 42 34, 46 24, 50 14 Z" fill="url(#favMetalRight)"/>

  <!-- Vértice Inferior Chanfrado -->
  <polygon points="26,46 32,46 38,46 32,52" fill="#7EE7FF"/>

  <!-- Linha de Brilho Prateada -->
  <path d="M 14 14 L 32 52 L 50 14" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <circle cx="32" cy="52" r="1.5" fill="#FFFFFF"/>
</svg>
