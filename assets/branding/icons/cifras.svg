  <text x="36" y="42" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#F5C542">F</text>
  <!-- Linhas de Letra sob o Acorde -->
  <line x1="20" y1="30" x2="44" y2="30" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="46" x2="44" y2="46" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
