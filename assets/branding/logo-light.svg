<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico para Fundo Claro -->
    <linearGradient id="lightMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#07101F"/>
    </linearGradient>

    <linearGradient id="lightMetalRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EE7FF"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0A1B38"/>
    </linearGradient>

    <linearGradient id="lightMetalFacet" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#07101F"/>
    </linearGradient>

    <filter id="lightGlowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Símbolo V Metálico com Alto Contraste -->
  <g filter="url(#lightGlowFilter)">
    <!-- Haste Esquerda Reta -->
    <path d="M 126 120 L 186 120 L 256 370 L 212 370 Z" fill="url(#lightMetalLeft)"/>

    <!-- Haste Direita com Curva Interna Sutil -->
    <path d="M 386 120 L 326 120 C 300 186, 278 252, 256 370 L 300 370 C 328 265, 356 186, 386 120 Z" fill="url(#lightMetalRight)"/>

    <!-- Vértice Chanfrado -->
    <polygon points="212,370 256,370 300,370 256,404" fill="url(#lightMetalFacet)"/>

    <!-- Linhas de Contorno -->
    <path d="M 126 120 L 256 404 L 386 120" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 186 120 L 256 370 C 278 252, 300 186, 326 120" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <circle cx="256" cy="404" r="3.5" fill="#0284C7"/>
</svg>
