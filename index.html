<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101F">

<title>Virtuo</title>
<meta name="description" content="A plataforma do músico virtuoso">
<meta property="og:title" content="Virtuo">
<meta property="og:description" content="A plataforma do músico virtuoso">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/icon.svg">
</head>

<body>

<div class="background"></div>

<header>

<div>

<div class="creator">
CRIADO POR NASHIX HOO
</div>

<h1>VIRTUO</h1>

<p>A plataforma do músico virtuoso</p>

</div>

<div style="display:flex; align-items:center; gap:8px;">
  <button class="ai-header-btn" onclick="show('ai')" title="Virtuo AI 2.0 - Inteligência Musical">
    <span>✨</span>
    <span>IA</span>
  </button>
  <div id="header-avatar" class="avatar" onclick="show('profile')" style="cursor:pointer;" title="Meu Perfil">✦</div>
</div>

</header>

<!-- Barra de Atalhos Rápidos para Culto e Ensaio (1 Toque) -->
<nav class="quick-toolbar" id="quick-tools-strip" aria-label="Ferramentas Musicais Rápidas">
  <button onclick="show('ai')" id="quick-btn-ai" title="Virtuo AI 2.0 - Inteligência Musical">
    <span>✨</span> Virtuo AI
  </button>
  <button onclick="show('library')" id="quick-btn-library" title="Acessar Cifras e Músicas">
    <span>📜</span> Cifra
  </button>
  <button onclick="show('tuner')" id="quick-btn-tuner" title="Afinador Cromático de Alta Precisão">
    <span>🎯</span> Afinador
  </button>
  <button onclick="show('vocal')" id="quick-btn-vocal" title="Virtuo Vocal (Afinador e Treinamento)">
    <span>🎤</span> Vocal
  </button>
  <button onclick="show('performance')" id="quick-btn-performance" title="Virtuo Performance (Acompanhamento em Tempo Real)">
    <span>🎯</span> Performance
  </button>
  <button onclick="show('coach')" id="quick-btn-coach" title="Treinador de Transição de Acordes">
    <span>⚡</span> Coach
  </button>
  <button onclick="show('band')" id="quick-btn-band" title="Modo Banda & Metrônomo">
    <span>🥁</span> Banda
  </button>
  <button onclick="show('ensaio')" id="quick-btn-ensaio" title="Sessões de Ensaio e Repertório">
    <span>📋</span> Ensaio
  </button>
  <button onclick="window.openMinisterModeQuick()" id="quick-btn-minister" title="Modo Ministro de Palco">
    <span>📖</span> Ministro
  </button>
  <button onclick="show('diagnostics')" id="quick-btn-diagnostics" title="Diagnóstico e Saúde do Sistema">
    <span>📊</span> Saúde
  </button>
</nav>

<main id="app"></main>

<nav class="tabbar">

<button onclick="show('home')" id="tab-btn-home">
🏠
<span>Início</span>
</button>

<button onclick="show('library')" id="tab-btn-library">
🎵
<span>Biblioteca</span>
</button>

<button onclick="show('ensaio')" id="tab-btn-ensaio">
🎸
<span>Ensaio</span>
</button>

<button onclick="show('band')" id="tab-btn-band">
🥁
<span>Banda</span>
</button>

<button onclick="show('comunidade')" id="tab-btn-comunidade">
👥
<span>Comunidade</span>
</button>

<button onclick="show('profile')" id="tab-btn-profile">
👤
<span>Perfil</span>
</button>

</nav>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[Virtuo PWA] Service Worker registrado:', reg.scope))
      .catch(err => console.warn('[Virtuo PWA] Falha ao registrar Service Worker:', err));
  });
}
</script>

</body>
</html>
