<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101F">

<title>VIRTUO — A plataforma do músico virtuoso</title>
<meta name="description" content="A plataforma do músico virtuoso">
<meta property="og:title" content="VIRTUO — A plataforma do músico virtuoso">
<meta property="og:description" content="A plataforma do músico virtuoso">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="src/styles/aura.css">
<link rel="stylesheet" href="src/styles/branding.css">
<link rel="icon" type="image/svg+xml" href="assets/branding/logo/favicon.svg">
<link rel="alternate icon" href="assets/icon.svg">

<script>
  // Safe early global navigation handler for immediate event accessibility
  function show(name) {
    if (typeof window._virtuoShow === 'function') {
      window._virtuoShow(name);
    } else if (typeof window.show === 'function' && window.show !== show) {
      window.show(name);
    } else {
      window._pendingScreen = name;
    }
  }
  window.show = show;
</script>
</head>

<body>

<!-- Virtuo Pulse: Cápsula Flutuante Contextual (Max 44px) -->
<div 
  id="virtuo-pulse-container" 
  style="
    position: fixed; 
    top: 14px; 
    left: 50%; 
    transform: translate(-50%, -10px) scale(0.96); 
    z-index: 9999; 
    opacity: 0; 
    pointer-events: none; 
    transition: opacity 160ms cubic-bezier(0.16, 1, 0.3, 1), transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
  "
></div>

<div class="background"></div>
<div class="virtuo-aura-ambient" aria-hidden="true">
  <div class="virtuo-aura-mist"></div>
  <div class="virtuo-aura-beams"></div>
</div>
<!-- 1. Horizon Glow Fixo na Base de Todas as Telas (Etapa 2) -->
<div id="virtuo-fixed-horizon-glow" class="virtuo-fixed-horizon-glow" aria-hidden="true"></div>

<header>

<div class="virtuo-horizon" style="display:flex; align-items:center; gap:14px;">

  <div class="virtuo-logo-glow" style="width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
    <img src="assets/branding/logo/logo-principal.svg" alt="Virtuo Logo" style="width:100%; height:100%; object-fit:contain;">
  </div>

  <div>
    <h1 style="margin:2px 0 2px; font-size:28px; letter-spacing:4px; line-height:1.1;">VIRTUO</h1>
    <p style="margin:0; font-size:12px; color:#A9BDD8;">A plataforma do músico virtuoso</p>
  </div>

</div>

<div style="display:flex; align-items:center; gap:8px;">
  <button class="ai-header-btn" onclick="window.show('ai')" title="Davi • Diretor Musical">
    <span style="font-size:15px;">🎼</span>
    <span style="font-size:11px; font-weight:700;">Davi</span>
  </button>
  <button 
    id="header-notif-btn" 
    class="ai-header-btn" 
    onclick="window.show('notifications')" 
    title="Notificações e Alertas"
    style="position:relative; width:38px; padding:0; justify-content:center;"
  >
    <span style="font-size:16px;">🔔</span>
    <span id="header-notif-badge" style="display:none; position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:#ef4444; border:2px solid #07101F;"></span>
  </button>
  <div id="header-avatar" class="avatar" onclick="window.show('profile')" style="cursor:pointer;" title="Meu Perfil">✦</div>
</div>

</header>

<!-- Barra de Atalhos Rápidos para Palco e Ensaio (1 Toque) -->
<nav class="quick-toolbar" id="quick-tools-strip" aria-label="Ferramentas Musicais Rápidas">
  <button onclick="window.show('live')" id="quick-btn-live" title="Live Sync Palco & Sincronização em Tempo Real" style="border-color: rgba(126,231,255,0.4); background: rgba(14,27,53,0.85);">
    <img src="assets/branding/icons/live.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Live
  </button>
  <button onclick="window.show('missions')" id="quick-btn-missions" title="Missões Musicais & Live Sync">
    <img src="assets/branding/icons/missoes.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Missões
  </button>
  <button onclick="window.show('ai')" id="quick-btn-ai" title="Davi • Diretor Musical">
    <span>🎼</span> Davi
  </button>
  <button onclick="window.show('library')" id="quick-btn-library" title="Acessar Cifras e Músicas">
    <img src="assets/branding/icons/cifras.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Cifra
  </button>
  <button onclick="window.show('tuner')" id="quick-btn-tuner" title="Afinador Cromático de Alta Precisão">
    <img src="assets/branding/icons/afinador.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Afinador
  </button>
  <button onclick="window.show('academy')" id="quick-btn-academy" title="Virtuo Academy (Ensino Musical do Nível 0 ao Profissional)">
    <span>🎓</span> Academy
  </button>
  <button onclick="window.show('vocal')" id="quick-btn-vocal" title="Virtuo Vocal (Afinador e Treinamento)">
    <img src="assets/branding/icons/vocal.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Vocal
  </button>
  <button onclick="window.show('performance')" id="quick-btn-performance" title="Virtuo Performance (Acompanhamento em Tempo Real)">
    <span>🎯</span> Performance
  </button>
  <button onclick="window.show('coach')" id="quick-btn-coach" title="Treinador de Transição de Acordes">
    <span>⚡</span> Coach
  </button>
  <button onclick="window.show('band')" id="quick-btn-band" title="Modo Banda & Metrônomo">
    <img src="assets/branding/icons/banda.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:18px; height:18px;"> Banda
  </button>
  <button onclick="window.show('ensaio')" id="quick-btn-ensaio" title="Sessões de Ensaio e Repertório">
    <span>📋</span> Ensaio
  </button>
  <button onclick="window.openMinisterModeQuick()" id="quick-btn-minister" title="Modo Ministro de Palco">
    <span>📖</span> Ministro
  </button>
  <button onclick="window.show('diagnostics')" id="quick-btn-diagnostics" title="Diagnóstico e Saúde do Sistema">
    <span>📊</span> Saúde
  </button>
</nav>

<main id="app"></main>

<nav class="tabbar">

<button onclick="window.show('home')" id="tab-btn-home">
<div class="tabbar-icon-wrap"><img src="assets/branding/logo/logo-principal.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Início</span>
</button>

<button onclick="window.show('library')" id="tab-btn-library">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/biblioteca.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Biblioteca</span>
</button>

<button onclick="window.show('live')" id="tab-btn-live">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/live.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Live</span>
</button>

<button onclick="window.show('ensaio')" id="tab-btn-ensaio">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/maestro.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Ensaio</span>
</button>

<button onclick="window.show('band')" id="tab-btn-band">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/banda.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Banda</span>
</button>

<button onclick="window.show('comunidade')" id="tab-btn-comunidade">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/perfil.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Comunidade</span>
</button>

<button onclick="window.show('profile')" id="tab-btn-profile">
<div class="tabbar-icon-wrap"><img src="assets/branding/icons/configuracoes.svg" class="virtuo-nav-icon" alt="" aria-hidden="true" style="width:20px; height:20px;"></div>
<span>Perfil</span>
</button>

</nav>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[Virtuo PWA] Service Worker registrado:', reg.scope))
      .catch(err => console.warn('[Virtuo PWA] Falha ao registrar Service Worker:', err));
  });
}
</script>

</body>
</html>
